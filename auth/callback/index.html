<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tesla OAuth Callback</title>
    <style>
      body { font-family: -apple-system, Helvetica, Arial, sans-serif; padding: 24px; }
      code { background: #f3f3f3; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>OAuth Callback</h1>
    <p>If you see a <code>code</code> in the URL, copy it below.</p>
    <p><strong>Code:</strong> <span id="code">(not found)</span></p>
    <p><strong>State:</strong> <span id="state">(not found)</span></p>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById("code").textContent = params.get("code") || "(not found)";
      document.getElementById("state").textContent = params.get("state") || "(not found)";
    </script>
  </body>
</html>
